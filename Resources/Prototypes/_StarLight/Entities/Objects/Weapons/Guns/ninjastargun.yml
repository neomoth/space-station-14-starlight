- type: entity
  id: WeaponNinjaStarGunBase
  parent: BaseItem
  name: ninja throwing star
  abstract: true
  components:
    - type: Sprite
      sprite: Objects/Weapons/Throwable/throwing_star.rsi
      layers:
        - state: icon
          map: [ "base" ]
    - type: Appearance
    - type: Gun
      clumsyProof: true
      cameraRecoilScalar: 0
      fireRate: 1.5
      selectedMode: FullAuto
      availableModes:
        - FullAuto
      soundGunshot: null
      noMuzzleFlash: true
    - type: BasicEntityAmmoProvider
      proto: ThrowingStarProjectile
      capacity: 3
      count: 3
    - type: RechargeBasicEntityAmmo
      rechargeCooldown: 0.01
      rechargeSound: null

- type: entity
  id: WeaponNinjaStarGun
  parent: WeaponNinjaStarGunBase
  components:
    - type: Unremoveable
    - type: BasicEntityAmmoProvider
      proto: ThrowingStarProjectileMulti

- type: entity
  id: WeaponNinjaStarGunAdmeme
  parent: WeaponNinjaStarGunBase
  suffix: Admeme
  components:
    - type: Gun
      fireRate: 10

- type: entity
  parent: ThrowingStarNinja
  id: ThrowingStarProjectile
  categories: [HideSpawnMenu]
  components:
    - type: DamageOtherOnHit
      damage:
        types:
          Slash: 4
          Piercing: 5
    - type: StaminaDamageOnCollide
      damage: 12
    - type: StaminaDamageOnEmbed
      damage: 6

- type: entity
  id: ThrowingStarProjectileAdmeme
  categories: [HideSpawnMenu]
  parent: ThrowingStar
  suffix: Admeme
  name: throwing star gun
  components:
    - type: DamageOtherOnHit
      damage:
        types:
          Slash: 8
          Piercing: 10
    - type: StaminaDamageOnCollide
      damage: 11
    - type: StaminaDamageOnEmbed
      damage: 5

- type: entity
  id: ThrowingStarProjectileMulti
  categories: [HideSpawnMenu]
  components:
    - type: ProjectileSpread
      proto: ThrowingStarProjectile
      count: 4
      spread: 30